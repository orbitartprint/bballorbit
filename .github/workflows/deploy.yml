name: Deploy to GitHub Pages

on:
  workflow_dispatch:

  push:
    branches: [main]
  repository_dispatch:
    types: [public-library-published]
  # A lightweight public metadata check; dependencies/build run only when needed.
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check for updated public drills
        id: publication
        if: github.event_name == 'schedule'
        run: node scripts/check-publication.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - run: npm ci
        if: github.event_name != 'schedule' || steps.publication.outputs.changed == 'true'

      - name: Verify public library loading
        if: github.event_name != 'schedule' || steps.publication.outputs.changed == 'true'
        run: npm test

      - name: Verify TypeScript
        if: github.event_name != 'schedule' || steps.publication.outputs.changed == 'true'
        run: npm run typecheck

      - name: Check vulnerable dependencies
        if: github.event_name != 'schedule' || steps.publication.outputs.changed == 'true'
        run: npm audit --audit-level=high

      - name: Verify public app store links before publishing
        if: github.event_name != 'schedule' || steps.publication.outputs.changed == 'true'
        run: npm run check:app-distribution:release

      - name: Build
        if: github.event_name != 'schedule' || steps.publication.outputs.changed == 'true'
        run: npm run build
        env:
          VITE_ACCOUNT_DELETION_REQUEST_URL: ${{ vars.VITE_ACCOUNT_DELETION_REQUEST_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.publication.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: ./dist
          cname: bballorbit.com
          force_orphan: true
