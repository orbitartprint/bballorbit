name: Deploy to GitHub Pages

on:
  workflow_dispatch:

  # Weekly production release: Sunday 16:00 UTC.
  # Europe/Berlin: 17:00 in winter (CET), 18:00 in summer (CEST).
  schedule:
    - cron: "0 16 * * 0"

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - name: Verify lint
        run: npm run lint

      - name: Verify public library loading
        run: npm test

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Check vulnerable dependencies
        run: npm audit --audit-level=high

      - name: Verify public app store links before publishing
        run: npm run check:app-distribution:release

      - name: Build
        run: npm run build
        env:
          VITE_ACCOUNT_DELETION_REQUEST_URL: ${{ vars.VITE_ACCOUNT_DELETION_REQUEST_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: ./dist
          cname: bballorbit.com
          force_orphan: true
