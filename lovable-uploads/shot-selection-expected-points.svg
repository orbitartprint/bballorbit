<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Expected points make shot value visible</title>
  <desc id="desc">Illustrative comparison: a rim finish at 65 percent yields 1.30 expected points, a three-pointer at 36 percent yields 1.08, and a long two at 42 percent yields 0.84.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a22"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a52"/>
      <stop offset="1" stop-color="#f57520"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1410" cy="120" r="250" fill="#f57520" opacity="0.06"/>
  <circle cx="160" cy="820" r="300" fill="#315cf5" opacity="0.05"/>

  <text x="100" y="105" fill="#f57520" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="5">BASKETBALL ORBIT</text>
  <text x="100" y="180" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">Expected points make shot value visible</text>
  <text x="100" y="228" fill="#aab0bd" font-family="Inter, Arial, sans-serif" font-size="26">Make probability × point value = expected points per attempt</text>

  <g filter="url(#shadow)">
    <rect x="100" y="290" width="420" height="360" rx="28" fill="#20242d" stroke="#f57520" stroke-width="3"/>
    <rect x="590" y="290" width="420" height="360" rx="28" fill="#20242d" stroke="#697386" stroke-width="2"/>
    <rect x="1080" y="290" width="420" height="360" rx="28" fill="#20242d" stroke="#8b5b36" stroke-width="2"/>
  </g>

  <circle cx="310" cy="365" r="44" fill="url(#orange)"/>
  <path d="M292 365h36M310 347v36" stroke="#11131a" stroke-width="7" stroke-linecap="round"/>
  <text x="310" y="452" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="750">Rim finish</text>
  <text x="310" y="510" text-anchor="middle" fill="#ffb47f" font-family="Inter, Arial, sans-serif" font-size="28">65% × 2 points</text>
  <text x="310" y="594" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="65" font-weight="850">1.30</text>
  <text x="310" y="626" text-anchor="middle" fill="#aab0bd" font-family="Inter, Arial, sans-serif" font-size="20">expected points</text>

  <circle cx="800" cy="365" r="44" fill="#303747" stroke="#8993a5" stroke-width="2"/>
  <text x="800" y="380" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="39" font-weight="800">3</text>
  <text x="800" y="452" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="750">Three-pointer</text>
  <text x="800" y="510" text-anchor="middle" fill="#c2c8d2" font-family="Inter, Arial, sans-serif" font-size="28">36% × 3 points</text>
  <text x="800" y="594" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="65" font-weight="850">1.08</text>
  <text x="800" y="626" text-anchor="middle" fill="#aab0bd" font-family="Inter, Arial, sans-serif" font-size="20">expected points</text>

  <circle cx="1290" cy="365" r="44" fill="#35281f" stroke="#a86d3b" stroke-width="2"/>
  <text x="1290" y="380" text-anchor="middle" fill="#e2ad7c" font-family="Inter, Arial, sans-serif" font-size="39" font-weight="800">2</text>
  <text x="1290" y="452" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="750">Long two</text>
  <text x="1290" y="510" text-anchor="middle" fill="#d2a57d" font-family="Inter, Arial, sans-serif" font-size="28">42% × 2 points</text>
  <text x="1290" y="594" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="65" font-weight="850">0.84</text>
  <text x="1290" y="626" text-anchor="middle" fill="#aab0bd" font-family="Inter, Arial, sans-serif" font-size="20">expected points</text>

  <rect x="100" y="700" width="1400" height="110" rx="22" fill="#151821" stroke="#303644"/>
  <text x="140" y="752" fill="#f57520" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">BREAK-EVEN</text>
  <text x="340" y="752" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="650">A 36% three equals a 54% two: both produce 1.08 expected points.</text>
  <text x="140" y="788" fill="#8991a0" font-family="Inter, Arial, sans-serif" font-size="19">Illustrative percentages only. Calculate the same comparison with your own team data and game context.</text>
</svg>
