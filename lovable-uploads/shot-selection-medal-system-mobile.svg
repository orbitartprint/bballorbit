<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1540" viewBox="0 0 900 1540" role="img" aria-labelledby="title desc">
  <title id="title">Shot selection medal system and ROB filter</title>
  <desc id="desc">Gold, silver, and bronze shot categories are stacked vertically above the Range, Open, Balanced filter.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171a22"/><stop offset="1" stop-color="#08090d"/></linearGradient><linearGradient id="gold"><stop stop-color="#ffd36a"/><stop offset="1" stop-color="#dc9a16"/></linearGradient><linearGradient id="silver"><stop stop-color="#e4e9ef"/><stop offset="1" stop-color="#7e8997"/></linearGradient><linearGradient id="bronze"><stop stop-color="#d49a68"/><stop offset="1" stop-color="#7b431f"/></linearGradient></defs>
  <rect width="900" height="1540" rx="32" fill="url(#bg)"/>
  <text x="60" y="82" fill="#f57520" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="4">BASKETBALL ORBIT</text>
  <text x="60" y="150" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800">A visible shot hierarchy</text>
  <text x="60" y="198" fill="#aab0bd" font-family="Inter, Arial, sans-serif" font-size="32">Medals define value. ROB checks the moment.</text>

  <rect x="60" y="255" width="780" height="285" rx="26" fill="#211f19" stroke="#dca01f" stroke-width="3"/>
  <circle cx="155" cy="355" r="48" fill="url(#gold)"/><text x="155" y="371" text-anchor="middle" fill="#2a1d05" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900">1</text>
  <text x="235" y="340" fill="#ffd36a" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="850">GOLD</text><text x="235" y="395" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">Rim finishes</text><text x="235" y="442" fill="#c7bfaa" font-family="Inter, Arial, sans-serif" font-size="32">Free throws</text><text x="100" y="505" fill="#d8d2c2" font-family="Inter, Arial, sans-serif" font-size="30">Highest team value</text>

  <rect x="60" y="580" width="780" height="285" rx="26" fill="#1d2129" stroke="#8993a2" stroke-width="2"/>
  <circle cx="155" cy="680" r="48" fill="url(#silver)"/><text x="155" y="696" text-anchor="middle" fill="#20242d" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900">2</text>
  <text x="235" y="665" fill="#d8dee7" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="850">SILVER</text><text x="235" y="720" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Open catch-and-shoot 3s</text><text x="235" y="767" fill="#aeb6c3" font-family="Inter, Arial, sans-serif" font-size="32">Created from advantage</text><text x="100" y="830" fill="#d2d7df" font-family="Inter, Arial, sans-serif" font-size="30">High-value perimeter opportunity</text>

  <rect x="60" y="905" width="780" height="300" rx="26" fill="#211b18" stroke="#925b32" stroke-width="2"/>
  <circle cx="155" cy="1005" r="48" fill="url(#bronze)"/><text x="155" y="1021" text-anchor="middle" fill="#24140b" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900">3</text>
  <text x="235" y="990" fill="#d49a68" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="850">BRONZE</text><text x="235" y="1045" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="700">Selected non-rim paint shots</text><text x="235" y="1092" fill="#c19a7b" font-family="Inter, Arial, sans-serif" font-size="32">Off-dribble 3s / exceptions</text><text x="100" y="1160" fill="#d1b59f" font-family="Inter, Arial, sans-serif" font-size="30">Player, coverage, or clock dependent</text>

  <rect x="60" y="1250" width="780" height="190" rx="26" fill="#151821" stroke="#373d49"/>
  <text x="100" y="1300" fill="#f57520" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="850">ROB FILTER</text>
  <g font-family="Inter, Arial, sans-serif" font-size="32" font-weight="750"><circle cx="145" cy="1360" r="34" fill="#232936" stroke="#f57520" stroke-width="2"/><text x="145" y="1371" text-anchor="middle" fill="#fff">R</text><text x="190" y="1371" fill="#fff">Range</text><circle cx="410" cy="1360" r="34" fill="#232936" stroke="#f57520" stroke-width="2"/><text x="410" y="1371" text-anchor="middle" fill="#fff">O</text><text x="455" y="1371" fill="#fff">Open</text><circle cx="650" cy="1360" r="34" fill="#232936" stroke="#f57520" stroke-width="2"/><text x="650" y="1371" text-anchor="middle" fill="#fff">B</text><text x="695" y="1371" fill="#fff">Balanced</text></g>
  <text x="60" y="1500" fill="#737b89" font-family="Inter, Arial, sans-serif" font-size="24">Adapt by player, level, coverage, score, and clock.</text>
</svg>
