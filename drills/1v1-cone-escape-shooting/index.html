  <script type="application/ld+json">{"@context":"https://schema.org","@type":"HowTo","name":"1v1 Cone Escape Shooting","description":"Create separation without the ball and turn the catch into a scoring opportunity.\nMain Goal\nHelp offensive players use changes of pace and direction to get open, time their cuts with the passer, and recognize whether to finish or pass back ","image":"https://oxavwwowalaepqxygzkt.supabase.co/storage/v1/object/public/library-media/af32f12f-e554-4870-845b-71edd8415411/50559139-aaef-4420-8336-2d0505747b66/thumb-de6900d31e5c4add1a35d8b9342ef6300e914de63a24bda670502ab41be0ae16.png","step":[{"@type":"HowToStep","name":"Phase 1","text":"1. O1 moves to get open, using either cone to create separation. Whenever O1 runs around a cone, X1 must follow around the same cone rather than cut across to take a shortcut.\n2. O1 can change direction and circle the cones as often as needed. The passer reads the movement and delivers the ball when a passing window opens."},{"@type":"HowToStep","name":"Phase 2","text":"On the catch, O1 looks to shoot or finish without dribbling. If there is no good scoring opportunity, O1 can pass back to the passer and move again to create another opening. X1 stays live throughout, denying passes and contesting attempts."},{"@type":"HowToStep","name":"Phase 3","text":"Continue until a score, defensive rebound, or turnover, then reset and rotate roles."},{"@type":"HowToStep","name":"Phase 4","text":""},{"@type":"HowToStep","name":"Phase 5","text":"Constraints\n1. One dribble: Allow O1 a maximum of one dribble per catch to create a better scoring opportunity.\n2. Change the angles: Vary the positions of the cones and the passer to create different cuts, passing windows, and shooting spots.\n3. Pressure the passer: Add a defender to the passer. The passer may now dribble to protect the ball and create a passing angle, while O1 continues working to get open."}]}</script>
