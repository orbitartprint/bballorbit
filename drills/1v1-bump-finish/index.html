  <script type="application/ld+json">{"@context":"https://schema.org","@type":"HowTo","name":"1v1 Bump Finish","description":"Absorb shoulder contact, stay balanced, and finish under pressure.\nMain Goal\nHelp ball handlers maintain balance and ball control through contact, then finish against a defender alongside them.\nSetup\n1. One ball handler (O1) starts at a cho","image":"https://oxavwwowalaepqxygzkt.supabase.co/storage/v1/object/public/library-media/af32f12f-e554-4870-845b-71edd8415411/20b910e0-2f51-4551-ad7f-3b11202a0048/thumb-4dd14b62030970d314edbc691f154863bc3bc8bd24c44ee638454b97800d27e6.png","step":[{"@type":"HowToStep","name":"Phase 1","text":"On an agreed signal, both players move toward the basket at the same time. O1 attacks off the dribble while X1 delivers a controlled shoulder-to-shoulder bump."},{"@type":"HowToStep","name":"Phase 2","text":"1. O1 absorbs the contact, maintains control of the dribble, and continues toward the rim. X1 stays live after the bump and tries to contest the finish.\n2. O1 looks to stay balanced, protect the ball, and adjust the finish to the defender’s position.\n3. Play until a score, defensive rebound, or turnover. Reset and switch roles. Alternate which side the defender starts on.\nConstraints\n1. Weak-hand attack: O1 must dribble with the weak hand.\n2. Different starting spots: Start from the top, wing, or corner to vary the driving angle.\n3. Vary the bump timing: Let X1 choose when to apply the bump during the drive so O1 must react to the contact."}]}</script>
