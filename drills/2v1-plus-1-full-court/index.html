  <script type="application/ld+json">{"@context":"https://schema.org","@type":"HowTo","name":"2v1 + 1 Full Court","description":"Attack the early advantage, read the recovering defense, and transition immediately.\nMain Goal\nHelp players exploit a temporary numbers advantage before help arrives, then react quickly to changing roles in continuous full-court play.\nSetup","image":"https://oxavwwowalaepqxygzkt.supabase.co/storage/v1/object/public/library-media/af32f12f-e554-4870-845b-71edd8415411/434d31b3-1fd2-474d-84e0-bb62a6eea961/thumb-4f7e264650f3f9bf962b3d39bb7d78e21ee05c89b75878bd6b7f655e2fb1c118.png","step":[{"@type":"HowToStep","name":"Phase 1","text":"1. O1 and O2 advance toward the opposite basket against X1, looking to use the initial 2v1 advantage.\n2. As soon as the first attacker crosses half court, X2 enters but must touch the center circle before defending. The possession becomes live 2v2 once X2 joins."},{"@type":"HowToStep","name":"Phase 2","text":"Play until a shot or defensive stop."},{"@type":"HowToStep","name":"Phase 3","text":"The attacker who last touched the ball — by shooting or committing the turnover — steps out and waits at half court as the next delayed defender."},{"@type":"HowToStep","name":"Phase 4","text":"1. The remaining attacker immediately becomes the transition defender and sprints back.\n2. The two former defenders secure possession, inbound after a made basket if needed, and attack the opposite basket.\n3. When the first new attacker crosses half court, the waiting defender (X3) enters, touches the center circle, and joins the defense. Repeat continuously with the same rotation."},{"@type":"HowToStep","name":"Phase 5","text":"Constraints\n- Change the recovery route: The delayed defender must touch a designated cone instead of the center circle.\n- Paint touch required: Offense must get a paint touch before attempting to score.\n- Two-dribble limit: Each attacker may use a maximum of two dribbles in the frontcourt per possession.\n- Shot selection: Only layups or catch-and-shoot three-pointers are allowed."}]}</script>
