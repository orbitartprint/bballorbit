  <script type="application/ld+json">{"@context":"https://schema.org","@type":"HowTo","name":"Farmer, Dog & Rabbit","description":"Chase the rabbit, evade the dog, and use the farmer’s protection.\nMain Goal\nDevelop agility, awareness, and ball control as players react to a moving chaser and a teammate creating protection through body positioning.\nSetup\n1. Define a play","image":"https://oxavwwowalaepqxygzkt.supabase.co/storage/v1/object/public/library-media/af32f12f-e554-4870-845b-71edd8415411/e0183f80-597c-42e9-bf26-72c162f999d6/thumb-18e226d2433e299b353d364d4939b6ed980b2cbebd274d667c29bbab81b7ee90.png","step":[{"@type":"HowToStep","name":"Phase 1","text":"1. On the coach’s signal, the dog (black) tries to tag the rabbit (green) while maintaining a live dribble. The rabbit moves freely within the boundaries, changing pace and direction to escape.\n2. The farmer (red) protects the rabbit by moving into the dog’s path and blocking the route with body positioning. The farmer may not use their hands to hold, push, or stop the dog."},{"@type":"HowToStep","name":"Phase 2","text":"The dog looks for a route around the farmer and tags the rabbit with the free hand. The rabbit reads the farmer’s position and uses that protection to stay out of reach."},{"@type":"HowToStep","name":"Phase 3","text":"After a successful tag, rotate roles: the dog becomes the farmer, the farmer becomes the rabbit, and the rabbit becomes the dog.\nConstraints\n1. Both dribble: Give the rabbit a ball as well. Both the dog and rabbit must maintain their dribble.\n2. Rabbit dribbles only: Give only the rabbit a ball. The dog chases without a ball.\n3. Adjust the space: Change the size or shape of the playing area to vary the available escape routes.\n4. Time limit: Set a short round, for example 15 seconds. If the rabbit avoids being tagged, the rabbit and farmer win the round. Rotate roles after every round."}]}</script>
