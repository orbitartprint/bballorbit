  <script type="application/ld+json">{"@context":"https://schema.org","@type":"HowTo","name":"Shoot or Drive: Two-Defender Read","description":"Read the closeout and choose between the shot and the drive.\nMain Goal\nHelp offensive players recognize an open shot or attack a closeout, then adjust their finish to the defender protecting the basket.\nSetup\n1. Two defenders (X1 and X2) st","image":"https://oxavwwowalaepqxygzkt.supabase.co/storage/v1/object/public/library-media/af32f12f-e554-4870-845b-71edd8415411/105d2ee2-6499-443f-888a-1bcb050235ad/thumb-95a4385d180012eb09c2ee4912d872502650c042b6064a4eb1ad3ea36d2ec285.png","step":[{"@type":"HowToStep","name":"Phase 1","text":"X1 and X2 pass the ball back and forth."},{"@type":"HowToStep","name":"Phase 2","text":"1. Either defender can choose when to pass to O1, keeping the timing and direction of the entry pass unpredictable.\n2. As soon as a defender passes to O1, that defender drops under the basket. The other defender closes out to contest the shot."},{"@type":"HowToStep","name":"Phase 3","text":"O1 reads the closeout and decides whether to shoot or attack the basket. If the closeout arrives late, O1 looks to take the open shot."},{"@type":"HowToStep","name":"Phase 4","text":"If the defender closes out aggressively, O1 can drive past and finish against the defender under the rim.\nPlay until a score, defensive rebound, or turnover. Reset and rotate roles so each player gets repetitions as the shooter and both defenders.\nConstraints\n1. Stationary rim defender: Once the passer reaches the position under the basket, they must keep their feet planted and may only contest with their arms — no jumping or moving to challenge the drive.\n2. Reward the shot: Award 3 points for a made shot and 1 point for a basket off the drive.\n3. Reward the drive: Reverse the scoring emphasis: 3 points for a basket off the drive and 1 point for a made shot. Choose one scoring system based on the practice focus."}]}</script>
