  <script type="application/ld+json">{"@context":"https://schema.org","@type":"HowTo","name":"Relay Tag Warm-Up","description":"Chase, evade, and sprint back in a race against the clock.\nMain Goal\nPrepare players for practice through quick reactions, changes of direction, and repeated sprints in a competitive team game.\nSetup\n1. Divide players into two equal teams: ","image":"https://oxavwwowalaepqxygzkt.supabase.co/storage/v1/object/public/library-media/af32f12f-e554-4870-845b-71edd8415411/c9ecc4a1-0b79-408b-9967-576928be28c9/thumb-9324bf635cde2485b191a12769d98b057c053af47cae405dde9444f92f2d9e70.png","step":[{"@type":"HowToStep","name":"Phase 1","text":"On the coach’s signal, start the clock. The first tagger enters the playing area and tries to tag any runner. Runners move freely within the boundaries, using changes of pace and direction to escape."},{"@type":"HowToStep","name":"Phase 2","text":""},{"@type":"HowToStep","name":"Phase 3","text":"After tagging a runner, the tagger sprints back behind the baseline. The next tagger may enter only once the previous teammate has crossed the baseline."},{"@type":"HowToStep","name":"Phase 4","text":"Tagged runners stay in the playing area and continue moving. They can be tagged again by a different tagger."},{"@type":"HowToStep","name":"Phase 5","text":"Continue until every tagger has tagged a runner and returned behind the baseline. Stop the clock when the final tagger crosses the line.\nSwitch roles and repeat under the same conditions. The team with the faster total time wins.\nConstraints\n1. Beat the clock: Set a time limit for the team to complete the relay.\n2. Dribbling runners: Give every runner a ball. Runners must maintain their dribble while avoiding the tagger.\n3. Everyone dribbles: Give the taggers a ball as well. They must dribble while chasing and returning to the baseline, tagging with their free hand."}]}</script>
