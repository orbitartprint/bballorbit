  <script type="application/ld+json">{"@context":"https://schema.org","@type":"HowTo","name":"Escape Room","description":"Protect the ball, find a gap, and escape before time runs out.\nMain Goal\nHelp ball handlers protect their dribble under pressure, read defensive positioning, and use changes of pace and direction to create an escape route.\nSetup\n1. Mark a s","image":"https://oxavwwowalaepqxygzkt.supabase.co/storage/v1/object/public/library-media/af32f12f-e554-4870-845b-71edd8415411/778613e1-30f8-4121-8960-241f795829f1/thumb-451370e0d0ddb33385064311b1c943f5a446aa6c66b2d4afc825ffc655885eb7.png","step":[{"@type":"HowToStep","name":"Phase 1","text":"1. On the coach’s signal, O1 starts dribbling and looks to escape through any edge of the square while keeping control of the ball.\n2. Each defender guards their assigned edge, moving along it to close gaps and attempting to steal the ball when O1 approaches."},{"@type":"HowToStep","name":"Phase 2","text":"O1 uses changes of direction, changes of pace, and body positioning to protect the dribble and attack an opening. If one route closes, O1 can retreat and find another way out."},{"@type":"HowToStep","name":"Phase 3","text":"O1 earns a point by getting outside the square with the ball under control before time expires. The defenders win the attempt if they gain possession, force a dribbling violation, or keep O1 inside until time runs out. Reset and rotate the ball handler.\nConstraints\n1. Touch to stop: Any touch of the ball by a defender immediately ends the attempt.\n2. Adjust the space: Make the square smaller or larger to change the pressure and available escape routes.\n3. Time pressure: Shorten the time limit to encourage quicker reads and decisive attacks."}]}</script>
