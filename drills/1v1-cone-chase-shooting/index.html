  <script type="application/ld+json">{"@context":"https://schema.org","@type":"HowTo","name":"1v1 Cone Chase Shooting","description":"Sprint into your shot and beat the defender’s contest.\nMain Goal\nHelp shooters get their feet ready, receive the pass, and release a balanced shot under pressure while training defenders to recover quickly and contest.\nSetup\n1. One offensiv","image":"https://oxavwwowalaepqxygzkt.supabase.co/storage/v1/object/public/library-media/af32f12f-e554-4870-845b-71edd8415411/d121b491-0490-476c-a17c-dcba5bd9807a/thumb-753201ab93b8431b6feea577536c080d2eca9569418b9868e84b7dae742b6de2.png","step":[{"@type":"HowToStep","name":"Phase 1","text":"1. O1 chooses to run around either cone. As soon as O1 moves, X1 reacts and runs around the opposite cone.\n2. O1 sprints to a shooting spot at the three-point line and receives the pass."},{"@type":"HowToStep","name":"Phase 2","text":"1. O1 attempts a catch-and-shoot jumper. The passer times the delivery so O1 can catch ready to shoot.\n2. X1 closes out after rounding the opposite cone and tries to contest the shot. O1 aims to get the shot off before the contest arrives while staying balanced and maintaining shooting form.\n3. Reset after each shot and rotate roles. Encourage O1 to use both directions across repetitions."},{"@type":"HowToStep","name":"Phase 3","text":"Variation\nAllow O1 to either shoot or drive to the basket. O1 must receive the ball outside the three-point line."},{"@type":"HowToStep","name":"Phase 4","text":"Constraints\n1. Pull-up version: Remove the passer. O1 keeps the ball, dribbles around the chosen cone, and shoots a pull-up jumper while X1 runs around the opposite cone.\n2. Different positions: Run the drill from different areas of the floor and vary the shooting spot.\n3. Adjust the pressure: Change the cone positions to shorten or lengthen either player’s route, giving the shooter more or less time before the contest."}]}</script>
