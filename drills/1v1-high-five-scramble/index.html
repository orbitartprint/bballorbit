  <script type="application/ld+json">{"@context":"https://schema.org","@type":"HowTo","name":"1v1 High-Five Scramble","description":"Win the ball, get to your feet, and finish against a chasing defender.\nMain Goal\nDevelop quick reactions and body control while training players to turn a loose-ball win into an immediate attack and finish under pressure.\nSetup\n1. Two playe","image":"https://oxavwwowalaepqxygzkt.supabase.co/storage/v1/object/public/library-media/af32f12f-e554-4870-845b-71edd8415411/382ab63e-8919-484e-b069-5e6d11b66712/thumb-a2cb985cd352a05894e5e23195839ba28e3480bd9eb3a23297a2326d27a1143f.png","step":[{"@type":"HowToStep","name":"Phase 1","text":"The players give each other a high-five to start the drill. Both then compete for the ball while remaining in the push-up position."},{"@type":"HowToStep","name":"Phase 2","text":"1. As soon as one player gains clear possession, that player picks up the ball, gets to their feet, and dribbles toward the designated basket for a layup.\n2. The other player immediately gets up and becomes the defender, chasing back to contest the finish.\n3. Play until a basket, defensive rebound, or turnover. Reset at half court and repeat.\nVariations\n1. Different starting positions: Start seated or kneeling instead of in a push-up position.\n2. Balance battle: Both players start standing on one leg. After the high-five, they compete for the ball while maintaining their balance. Putting the raised foot down or falling over loses the contest; the other player gains possession and attacks."}]}</script>
