  <script type="application/ld+json">{"@context":"https://schema.org","@type":"HowTo","name":"1v1 Shoulder Pressure","description":"Absorb contact, change direction, and attack against a recovering defender.\nMain Goal\nHelp ball handlers maintain balance under contact and create an advantage with a sudden change of direction, while training defenders to react, recover, a","image":"https://oxavwwowalaepqxygzkt.supabase.co/storage/v1/object/public/library-media/af32f12f-e554-4870-845b-71edd8415411/bdb26217-49ba-4a0d-9259-592cba0a96d1/thumb-bdc3a7329cac66ed1e91ed6d5a8c60bc10b16eef131eb8639f8a46b820ee0148.png","step":[{"@type":"HowToStep","name":"Phase 1","text":"Both players apply controlled shoulder-to-shoulder pressure as they move toward half court. O1 dribbles backward while X1 moves forward, maintaining contact."},{"@type":"HowToStep","name":"Phase 2","text":"1. O1 chooses when to change direction and attack the basket. As soon as O1 attacks, the drill becomes live 1v1 and X1 reacts, recovers, and defends fully.\n2. O1 looks to use the initial advantage to get downhill and finish before X1 can recover. Play until a score, defensive rebound, or turnover, then switch roles. Alternate starting sides to practice contact on both shoulders.\n3. Vary the trigger: let O1 choose the moment to attack, use a coach’s whistle, or require O1 to cross beyond the three-point line before changing direction.\nConstraints\n1. Weak hand only\n2. Layups only\n3. Hostage dribble: After changing direction, O1 must briefly keep X1 behind them with a controlled hostage dribble before attacking the rim."}]}</script>
