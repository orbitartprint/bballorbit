  <script type="application/ld+json">{"@context":"https://schema.org","@type":"HowTo","name":"2v2 Middle Circle Chase","description":"Choose a basket and attack before the trailing defender recovers.\nMain Goal\nHelp attackers recognize and exploit a temporary 2v1 advantage, while training defenders to delay the attack and recover into the play.\nSetup\n1. Two attackers (O1 a","image":"https://oxavwwowalaepqxygzkt.supabase.co/storage/v1/object/public/library-media/af32f12f-e554-4870-845b-71edd8415411/3dcf0942-10e3-4b83-92c8-6354fed3f4f9/thumb-a1bff54b900a231a188ef5b5040b55fe9de7af3d9b509fe3cfda28202abb396a.png","step":[{"@type":"HowToStep","name":"Phase 1","text":"O1 and O2 exchange quick passes while holding their starting positions. Either attacker can choose when to break toward either basket."},{"@type":"HowToStep","name":"Phase 2","text":"1. The first foot movement by an attacker triggers the live 2v2. Both attackers move toward the chosen basket, and both defenders react immediately.\n2. The defender closer to that basket tries to delay the attack and protect the rim, while the trailing defender sprints back to recover. This creates a temporary 2v1 + 1 situation.\n3. The attackers look to use spacing, quick passes, and decisive drives to create a scoring opportunity before the trailing defender arrives. If the defense recovers, continue playing live 2v2.\n4. Play until a score, defensive rebound, or turnover. Reset at the center circle and rotate roles.\nConstraints\n1. Minimum passes: Complete at least three passes before either attacker can initiate the attack.\n2. Dribble start: Instead of exchanging passes, one attacker starts dribbling on the spot. The first step toward either basket triggers the live play.\n3. One-dribble finish: The finishing player may take a maximum of one dribble after the final catch.\n4. Specific finish: Require a designated finishing type, such as a finish off two feet.\n5. Delayed recovery: On the attacking trigger, both defenders must touch the floor before moving to defend."}]}</script>
