  <script type="application/ld+json">{"@context":"https://schema.org","@type":"HowTo","name":"2v2 Around the Arc","description":"Connect through a handoff and turn the exchange into an advantage.\nMain Goal\nHelp players coordinate the timing and spacing of a dribble handoff, read the defense, and create a scoring opportunity in live 2v2.\nSetup\n1. Two offensive players","image":"https://oxavwwowalaepqxygzkt.supabase.co/storage/v1/object/public/library-media/af32f12f-e554-4870-845b-71edd8415411/ddf8e7be-dffb-49cf-8bf4-ac083610fce2/thumb-19d6885a81125f224357d9a769bd1697fa6bc058947604c9a4bad1f24eec3f45.png","step":[{"@type":"HowToStep","name":"Phase 1","text":"1. O1 starts the drill by dribbling out of the corner. As soon as O1 moves, all four players may move.\n2. O1 dribbles around the arc toward the top. O2 comes from the opposite corner to meet O1 for a dribble handoff, while both defenders move with their matchups."},{"@type":"HowToStep","name":"Phase 2","text":"After the handoff, play fully live 2v2. The attackers look to use the exchange to create separation, turn the corner, and attack the basket. The player giving the handoff stays involved by rolling, cutting, or spacing according to the defense."},{"@type":"HowToStep","name":"Phase 3","text":"Play until a score, defensive rebound, or turnover. Reset in the corners, alternate the starting ball handler, and rotate roles.\nConstraints\n1. Reject and backdoor: Once the attackers are above the free-throw line extended, allow O2 to reject the handoff and cut backdoor for a pass from O1. Or allow O1 to keep the ball and drive to the basket.\n2. Time pressure: Require a shot within eight seconds of O1’s first dribble.\n3. Layups only: The attackers must create a layup to score."}]}</script>
